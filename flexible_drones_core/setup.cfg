[develop]
script_dir=$base/lib/flexible_drones_core

[install]
install_scripts=$base/lib/flexible_drones_core

[flake8]
max-line-length = 130
inline-quotes = single
avoid-escape = true
extend-ignore = E203, W503, I100, I101, I201, CNL100, D100, D101, D102, D103, D104, D107, D205, D400, B902
docstring-convention = pep257

[pep257]
convention = pep257
